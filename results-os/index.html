<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results OS | Doom Pile</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta
    name="description"
    content="Results OS is a stay-on-track dashboard with daily prompts, weekly reviews, and a trap for shiny new ideas."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #0e0e0c;
      --paper: #f4f1ea;
      --paper-deep: #eae5da;
      --muted: #6b6862;
      --accent: #c8431f;
      --green: #2f5d3a;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(ellipse at top, rgba(200, 67, 31, 0.05), transparent 46%),
        radial-gradient(ellipse at bottom right, rgba(14, 14, 12, 0.04), transparent 42%),
        var(--paper);
      color: var(--ink);
      font-family: "Inter Tight", system-ui, sans-serif;
    }

    textarea, input, select, button { font: inherit; }
    a { color: inherit; }
    ::selection { background: var(--ink); color: var(--paper); }
    details summary::-webkit-details-marker { display: none; }

    .results-shell { min-height: 100vh; }
    .results-mobile-grid-4,
    .results-stage-grid,
    .results-review-stats { display: grid; }

    @media (max-width: 720px) {
      .results-mobile-grid-4 {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 14px !important;
      }
      .results-stage-grid {
        grid-template-columns: 1fr !important;
        gap: 8px !important;
      }
      .results-review-stats {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const tokens = {
      ink: "#0E0E0C",
      paper: "#F4F1EA",
      paperDeep: "#EAE5DA",
      muted: "#6B6862",
      accent: "#C8431F",
      accentSoft: "#E8C9BC",
      green: "#2F5D3A",
      fontDisplay: '"Fraunces", "Times New Roman", serif',
      fontBody: '"Inter Tight", system-ui, sans-serif',
      fontMono: '"JetBrains Mono", ui-monospace, monospace',
    };

    const STORE_KEY = "resultsos:coach:v1";
    const RESULTS_OS_UNLOCK_KEY = "resultsos:unlocked:v1";
    const RESULTS_OS_PREVIEW_DAYS = 3;
    const RESULTS_OS_UNLOCK_CODE = "RESULTSOS21";
    const RESULTS_OS_UNLOCK_CODE_LEGACY = "resultsos21";
    const RESULTS_OS_CHECKOUT_URL = "https://buy.stripe.com/5kQfZj7HZgZSawwbnZcQU0g";
    const DEFAULT_PROFILE = {
      firstName: "",
      goalName: "",
      goalDeadline: "",
      successVision: "I finish what matters before I let new ideas take over.",
      currentFocus: "Protect time for the next concrete step.",
      consistencyTarget: 5,
    };

    function loadState() {
      try {
        const raw = window.localStorage.getItem(STORE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function saveState(state) {
      try {
        window.localStorage.setItem(STORE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn("save failed", e);
      }
    }

    function isResultsUnlocked() {
      try {
        return window.localStorage.getItem(RESULTS_OS_UNLOCK_KEY) === "1";
      } catch {
        return false;
      }
    }

    function unlockResults() {
      try {
        window.localStorage.setItem(RESULTS_OS_UNLOCK_KEY, "1");
      } catch (e) {
        console.warn("unlock failed", e);
      }
    }

    const STAGE_1_PROMPTS = [
      { day: 1, title: "Pick the thing", body: "You do not need a better idea. You need one goal that matters enough to survive your mood swings. For the next 21 days, {{goalName}} is the thing. Everything else is background noise.", today: "Write your goal in one plain sentence. Then write the next visible step you can do for {{goalName}} this week.", why: "Clarity removes wiggle room. A vague goal is where dopamine slips in." },
      { day: 2, title: "Shrink the mountain", body: "Brains that chase novelty often make goals too big to start. Your job is to make {{goalName}} embarrassingly actionable.", today: "Break {{goalName}} into 3 tiny moves. Pick the first one and put 30 minutes aside for it today.", why: "Small, visible progress beats dramatic planning every time." },
      { day: 3, title: "Catch the escape route", body: "Today your brain will offer a more exciting route. New notebook. New system. New side mission. That is not insight. That is avoidance wearing good shoes.", today: "Use the Idea Trap for every new idea today. Do not switch goals. Finish the next step you already chose.", why: "The right path often feels boring before it feels rewarding." },
      { day: 4, title: "Make friction work for you", body: "If starting is hard, the setup is wrong. Reduce the steps between you and the work.", today: "Set up your space, file, tab, notes, or materials so tomorrow's first step takes less than two minutes to begin.", why: "Ease matters. We protect focus by lowering the cost of re-entry." },
      { day: 5, title: "Truth check", body: "At the end of the week, the only useful question is: did you do the work you said mattered?", today: "Count your week so far. Focus blocks. Days on track. Ideas parked. Distractions dodged. Just the numbers.", why: "Measurement turns vague guilt into something you can actually steer." },
      { day: 6, title: "Rest without drifting", body: "Rest matters. So does not turning rest into a soft launch for three new plans.", today: "Take a proper break. If a shiny idea appears, park it and go back to resting instead of researching it.", why: "Recovery is useful. Accidental re-planning is not." },
      { day: 7, title: "Plan the next seven", body: "Do not redesign your life. Just make next week easier to follow than this one.", today: "Choose the 3 most important moves for {{goalName}} next week and decide when each one will happen.", why: "Simple plans survive real life better than ambitious ones." },
      { day: 8, title: "Re-enter fast", body: "Week two starts with resistance. Expect it. Start anyway.", today: "Do the smallest useful step on {{goalName}} before you check messages, browse, or tidy something that does not matter.", why: "Your first win of the day sets the tone for the rest of it." },
      { day: 9, title: "Protect the block", body: "Attention leaks before it breaks. Every interruption teaches your brain that the goal is optional.", today: "Create one protected focus block today. Phone away. Tabs closed. One task only.", why: "Depth does not happen by accident." },
      { day: 10, title: "When you feel behind", body: "Feeling behind makes people either quit or start something new. Both are traps.", today: "Write down what 'enough for today' looks like on {{goalName}}. Do that first. Stop bargaining for a more exciting plan.", why: "A smaller completed step beats a bigger imagined recovery." },
      { day: 11, title: "Notice what you avoid", body: "The sticky bit is usually the real work. That is why your brain keeps decorating the edges instead.", today: "Name the bit of {{goalName}} you've been skirting around. Spend 20 minutes on that exact part.", why: "Progress often lives inside the task you least want to touch." },
      { day: 12, title: "The shiny thing test", body: "A fresh idea can feel like relief because it lets you stop being uncomfortable on the current path.", today: "If a new plan appears, send it to the Idea Trap. Then return to the current focus: {{currentFocus}}.", why: "Not all ideas are bad. Most just do not belong to today." },
      { day: 13, title: "Boring is not broken", body: "The middle of anything meaningful is repetitive. That does not mean it is wrong.", today: "Repeat the habit that has helped most this week. Same time, same setup, same next move.", why: "Consistency looks dull from the outside and powerful in hindsight." },
      { day: 14, title: "Week two review", body: "Do not rate the week by vibes. Rate it by evidence.", today: "Check your numbers again. Then write one sentence: what actually helped you stay on track?", why: "Patterns beat feelings when you are trying to change behaviour." },
      { day: 15, title: "Tighten the goal", body: "If {{goalName}} still feels slippery, it may need clearer edges rather than more motivation.", today: "Rewrite your goal so it is specific enough to know what counts as progress this week.", why: "Specific goals are easier to defend from distractions." },
      { day: 16, title: "Delay the detour", body: "You do not have to kill every idea. You just have to stop letting it hijack today.", today: "Choose one tempting detour you will deliberately delay for seven days. Write it down and leave it parked.", why: "Delay is often enough to expose a false urgency." },
      { day: 17, title: "Use proof, not panic", body: "You already have evidence about what helps you move. Use that instead of trying to rescue the week with intensity.", today: "Repeat your best focus setup from the last two weeks and complete one full block on {{goalName}}.", why: "Reliable conditions matter more than motivational speeches." },
      { day: 18, title: "Reduce the choice load", body: "Too many options make distraction easier. Decide fewer things in the moment.", today: "Pick tomorrow's first task for {{goalName}} before you finish today. Leave a visible note for yourself.", why: "Pre-deciding keeps tomorrow's brain from wandering off." },
      { day: 19, title: "Stay with it after a win", body: "A little progress often triggers a celebration spiral: new plans, new tabs, new ambition. Hold the line.", today: "If you made progress, do not expand the scope. Record the win, then keep the next step small and obvious.", why: "Momentum grows when you protect it from your own excitement." },
      { day: 20, title: "Finish the loop", body: "By now you know which distractions keep showing up. Stop acting surprised by them.", today: "Write down the top 3 ways you abandon {{goalName}}. For each one, choose one tiny counter-move.", why: "Self-awareness becomes useful when it changes the environment." },
      { day: 21, title: "Three-week reset", body: "Look at what you actually did across 21 days. Not the fantasy version. Not the guilty version. The real one.", today: "Read your honesty log, your parked ideas, and your numbers. Decide what stays, what goes, and what the next 21 days are really about.", why: "A real reset comes from evidence, not a dramatic new promise." },
    ];

    const STAGE_1_METRICS = [
      { key: "focus_blocks", label: "Focus blocks", target_per_week: 10 },
      { key: "days_on_track", label: "Days on track", target_per_week: 5 },
      { key: "ideas_parked", label: "Ideas parked", target_per_week: 3 },
      { key: "distractions_resisted", label: "Distractions resisted", target_per_week: 7 },
    ];

    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function startOfWeekKey() {
      const d = new Date();
      const day = d.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function daysBetween(d1, d2) {
      return Math.floor((new Date(d2) - new Date(d1)) / 86400000);
    }

    function personalizeText(text, profile) {
      const replacements = {
        "{{goalName}}": profile.goalName?.trim() || "your goal",
        "{{currentFocus}}": profile.currentFocus?.trim() || DEFAULT_PROFILE.currentFocus,
        "{{goalDeadline}}": profile.goalDeadline?.trim() || "your deadline",
        "{{successVision}}": profile.successVision?.trim() || DEFAULT_PROFILE.successVision,
      };

      return Object.entries(replacements).reduce((result, [token, value]) => result.replaceAll(token, value), text);
    }

    function ResultsOS() {
      const [hydrated, setHydrated] = useState(false);
      const [state, setState] = useState({
        startDate: todayKey(),
        currentDay: 1,
        profile: DEFAULT_PROFILE,
        completed: {},
        metrics: {},
        parkedIdeas: [],
        log: [],
        weeklyReviews: [],
        focusBlocksTotal: 0,
      });
      const [view, setView] = useState("today");
      const [trapOpen, setTrapOpen] = useState(false);
      const [logOpen, setLogOpen] = useState(false);
      const [unlockOpen, setUnlockOpen] = useState(false);
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [profileOpen, setProfileOpen] = useState(false);

      useEffect(() => {
        const loaded = loadState();
        if (loaded) {
          setState((prev) => ({
            ...prev,
            ...loaded,
            profile: { ...DEFAULT_PROFILE, ...(loaded.profile || {}) },
          }));
        }
        setIsUnlocked(isResultsUnlocked());
        setHydrated(true);
      }, []);

      useEffect(() => {
        if (!hydrated) return;
        saveState(state);
      }, [state, hydrated]);

      useEffect(() => {
        if (!hydrated) return;
        const elapsed = daysBetween(state.startDate, todayKey()) + 1;
        const target = Math.min(elapsed, STAGE_1_PROMPTS.length);
        if (target !== state.currentDay && target > 0) {
          setState((prev) => ({ ...prev, currentDay: target }));
        }
      }, [hydrated, state.startDate]);

      if (!hydrated) {
        return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: tokens.fontMono, fontSize: "11px", letterSpacing: "0.2em", textTransform: "uppercase", color: tokens.muted }}>loading results os...</div>;
      }

      const todayPrompt = STAGE_1_PROMPTS[state.currentDay - 1] || STAGE_1_PROMPTS[STAGE_1_PROMPTS.length - 1];
      const weekKey = startOfWeekKey();
      const thisWeek = state.metrics[weekKey] || {};
      const previewLocked = !isUnlocked && state.currentDay > RESULTS_OS_PREVIEW_DAYS;
      const previewDaysLeft = Math.max(0, RESULTS_OS_PREVIEW_DAYS - state.currentDay + 1);
      const profile = { ...DEFAULT_PROFILE, ...(state.profile || {}) };
      const hasProfile = Boolean(profile.goalName.trim());
      const personalizedPrompt = {
        ...todayPrompt,
        body: personalizeText(todayPrompt.body, profile),
        today: personalizeText(todayPrompt.today, profile),
        why: personalizeText(todayPrompt.why, profile),
      };

      const bumpMetric = (key, delta = 1) => {
        setState((prev) => {
          const week = prev.metrics[weekKey] || {};
          return { ...prev, metrics: { ...prev.metrics, [weekKey]: { ...week, [key]: Math.max(0, (week[key] || 0) + delta) } } };
        });
      };

      const setMetric = (key, value) => {
        setState((prev) => {
          const week = prev.metrics[weekKey] || {};
          return { ...prev, metrics: { ...prev.metrics, [weekKey]: { ...week, [key]: value } } };
        });
      };

      const markTodayComplete = () => {
        setState((prev) => ({ ...prev, completed: { ...prev.completed, [`day-${state.currentDay}`]: true } }));
      };

      const isTodayComplete = state.completed[`day-${state.currentDay}`];

      return (
        <div className="results-shell">
          <div style={{ maxWidth: "980px", margin: "0 auto", padding: "24px 22px 0" }}>
            <a href="/" style={{ display: "inline-flex", alignItems: "center", gap: "10px", textDecoration: "none", fontFamily: tokens.fontMono, fontSize: "11px", letterSpacing: "0.16em", textTransform: "uppercase", color: tokens.muted }}>← Back to Doom Pile</a>
          </div>

          <div style={{ padding: "18px 28px", display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: `1px solid ${tokens.paperDeep}`, position: "sticky", top: 0, background: "rgba(244, 241, 234, 0.96)", backdropFilter: "blur(12px)", zIndex: 10 }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: "12px" }}>
              <span style={{ fontFamily: tokens.fontDisplay, fontSize: "20px", fontStyle: "italic", fontWeight: 500 }}>Results</span>
              <span style={{ fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.24em", textTransform: "uppercase", color: tokens.muted }}>OS · Stage 1</span>
            </div>
            <div style={{ fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.18em", textTransform: "uppercase", color: tokens.muted }}>Day {state.currentDay} / 21</div>
          </div>

          <div style={{ maxWidth: "980px", margin: "0 auto", padding: "20px 28px 0" }}>
            <div style={{ padding: "28px", background: "linear-gradient(135deg, rgba(255,255,255,0.55), rgba(239,232,218,0.95))", border: `1px solid ${tokens.paperDeep}`, marginBottom: "18px" }}>
              <div style={{ fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.24em", textTransform: "uppercase", color: tokens.accent, marginBottom: "10px" }}>Stay on track mode</div>
              <h1 style={{ fontFamily: tokens.fontDisplay, fontSize: "clamp(34px, 6vw, 58px)", lineHeight: 0.96, letterSpacing: "-0.03em", margin: "0 0 14px", fontWeight: 500 }}>A 21-day system for <span style={{ fontStyle: "italic" }}>finishing what matters.</span></h1>
              <p style={{ maxWidth: "46rem", margin: 0, fontSize: "16px", color: tokens.muted, lineHeight: 1.65 }}>Results OS is for the days when a fresh idea threatens to pull you off course. Set one real goal, define the next move, and let the tool keep steering you back to the work.</p>
              <div style={{ display: "flex", flexWrap: "wrap", gap: "10px", marginTop: "18px" }}>
                <div style={{ padding: "8px 12px", border: `1px solid ${tokens.paperDeep}`, background: "rgba(255,255,255,0.6)", fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.16em", textTransform: "uppercase", color: tokens.muted }}>
                  {isUnlocked ? "Full curriculum unlocked" : `Free preview · first ${RESULTS_OS_PREVIEW_DAYS} days`}
                </div>
                <button onClick={() => setProfileOpen(true)} style={{ padding: "10px 14px", background: "transparent", color: tokens.ink, border: `1px solid ${tokens.paperDeep}`, fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.16em", textTransform: "uppercase", cursor: "pointer" }}>
                  {hasProfile ? "Edit objectives" : "Set objectives"}
                </button>
                {!isUnlocked && (
                  <button onClick={() => setUnlockOpen(true)} style={{ padding: "10px 14px", background: tokens.ink, color: tokens.paper, border: "none", fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.16em", textTransform: "uppercase", cursor: "pointer" }}>
                    Unlock all 21 days
                  </button>
                )}
              </div>
            </div>
          </div>

          <div style={{ display: "flex", padding: "0 28px", borderBottom: `1px solid ${tokens.paperDeep}`, overflowX: "auto" }}>
              {[
                { k: "today", label: "Today" },
                { k: "metrics", label: "The Numbers" },
                { k: "vision", label: "The Goal" },
                { k: "review", label: "Weekly Review" },
              ].map((tab) => (
              <button key={tab.k} onClick={() => setView(tab.k)} style={{ padding: "16px 16px 14px", background: "transparent", border: "none", borderBottom: `2px solid ${view === tab.k ? tokens.accent : "transparent"}`, fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.2em", textTransform: "uppercase", color: view === tab.k ? tokens.ink : tokens.muted, cursor: "pointer", flexShrink: 0 }}>{tab.label}</button>
            ))}
          </div>

          <div style={{ maxWidth: "780px", margin: "0 auto", padding: "32px 28px 120px" }}>
            {!hasProfile && (
              <LockedPanel
                title="Set your goal first."
                body="Results OS works best when it has one real goal to defend. Add that once and the dashboard will keep pointing you back to it."
                cta="Set objectives"
                onUnlock={() => setProfileOpen(true)}
              />
            )}
            {view === "today" && hasProfile && (
              previewLocked ? (
                <LockedCurriculumView currentDay={state.currentDay} onUnlock={() => setUnlockOpen(true)} />
              ) : (
                <TodayView prompt={personalizedPrompt} day={state.currentDay} isComplete={isTodayComplete} onComplete={markTodayComplete} onLog={() => setLogOpen(true)} thisWeek={thisWeek} previewDaysLeft={!isUnlocked ? previewDaysLeft : null} firstName={profile.firstName} goalName={profile.goalName} />
              )
            )}
            {view === "metrics" && hasProfile && (
              <MetricsView
                metrics={state.metrics}
                weekKey={weekKey}
                thisWeek={thisWeek}
                onBump={bumpMetric}
                onSet={setMetric}
                focusBlocksTotal={state.focusBlocksTotal}
                setFocusBlocksTotal={(v) => setState((p) => ({ ...p, focusBlocksTotal: v }))}
                locked={!isUnlocked}
                onUnlock={() => setUnlockOpen(true)}
                consistencyTarget={profile.consistencyTarget}
              />
            )}
            {view === "vision" && hasProfile && <VisionView profile={profile} />}
            {view === "review" && hasProfile && (
              <ReviewView weeklyReviews={state.weeklyReviews} onSubmitReview={(review) => setState((p) => ({ ...p, weeklyReviews: [review, ...p.weeklyReviews] }))} locked={!isUnlocked} onUnlock={() => setUnlockOpen(true)} />
            )}
          </div>

          {isUnlocked && (
            <button onClick={() => setTrapOpen(true)} title="Got a new idea? Run it through the trap." style={{ position: "fixed", bottom: "24px", right: "24px", background: tokens.ink, color: tokens.paper, border: "none", padding: "16px 22px", borderRadius: "999px", fontFamily: tokens.fontMono, fontSize: "11px", letterSpacing: "0.16em", textTransform: "uppercase", cursor: "pointer", boxShadow: "0 8px 28px rgba(14,14,12,0.25)", zIndex: 20, display: "flex", alignItems: "center", gap: "8px" }}>
              <span style={{ color: tokens.accent }}>!</span> New idea?
            </button>
          )}

          <DopamineTrapModal open={trapOpen} onClose={() => setTrapOpen(false)} onPark={(idea) => setState((prev) => ({ ...prev, parkedIdeas: [idea, ...prev.parkedIdeas] }))} parkedIdeas={state.parkedIdeas} currentTask={personalizedPrompt.today} goalName={profile.goalName} />
          <LogModal open={logOpen} onClose={() => setLogOpen(false)} log={state.log} onAdd={(entry) => setState((prev) => ({ ...prev, log: [entry, ...prev.log] }))} />
          <UnlockResultsModal open={unlockOpen} onClose={() => setUnlockOpen(false)} onUnlock={() => { unlockResults(); setIsUnlocked(true); setUnlockOpen(false); }} />
          <ProfileSetupModal open={profileOpen || !hasProfile} profile={profile} onClose={() => hasProfile && setProfileOpen(false)} onSave={(nextProfile) => { setState((prev) => ({ ...prev, profile: nextProfile })); setProfileOpen(false); }} />
        </div>
      );
    }

    function TodayView({ prompt, day, isComplete, onComplete, onLog, thisWeek, previewDaysLeft, firstName, goalName }) {
      const h = new Date().getHours();
      const greeting = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
      return (
        <div>
          {previewDaysLeft !== null && (
            <div style={{ padding: "14px 16px", marginBottom: "22px", border: `1px solid ${tokens.paperDeep}`, background: "rgba(255,255,255,0.55)", fontFamily: tokens.fontBody, fontSize: "14px", color: tokens.muted, lineHeight: 1.55 }}>
              Free preview mode. You can explore the first {RESULTS_OS_PREVIEW_DAYS} days before unlocking the full 21-day curriculum.
            </div>
          )}
          <div style={{ fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.24em", textTransform: "uppercase", color: tokens.muted, marginBottom: "8px" }}>{greeting}, {firstName?.trim() || "friend"} · Day {day}</div>
          <h2 style={{ fontFamily: tokens.fontDisplay, fontSize: "clamp(36px, 5vw, 56px)", fontWeight: 400, lineHeight: 1, letterSpacing: "-0.02em", margin: "0 0 32px", fontStyle: "italic" }}>{prompt.title}</h2>
          <p style={{ fontFamily: tokens.fontDisplay, fontSize: "20px", lineHeight: 1.5, color: tokens.ink, margin: "0 0 40px", fontWeight: 400 }}>{prompt.body}</p>

          <div style={{ background: tokens.ink, color: tokens.paper, padding: "32px", marginBottom: "32px" }}>
            <div style={{ fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.24em", textTransform: "uppercase", color: tokens.accent, marginBottom: "12px" }}>Today&apos;s one move</div>
            <div style={{ fontFamily: tokens.fontDisplay, fontSize: "26px", lineHeight: 1.3, fontWeight: 500, marginBottom: "20px" }}>{prompt.today}</div>
            <div style={{ fontFamily: tokens.fontMono, fontSize: "11px", letterSpacing: "0.08em", color: tokens.accentSoft, lineHeight: 1.6, paddingTop: "16px", borderTop: "1px solid rgba(244,241,234,0.15)" }}>WHY → {prompt.why}</div>
          </div>

          <div style={{ display: "grid", gap: "12px", marginBottom: "40px" }}>

    function DopamineTrapModal({ open, onClose, onPark, parkedIdeas, currentTask, goalName }) {
      const [step, setStep] = useState("idea");
      const [idea, setIdea] = useState("");
      const [a1, setA1] = useState(null);
      const [a2, setA2] = useState(null);
      const [a3, setA3] = useState(null);

      useEffect(() => {
        if (!open) return;
        setStep("idea"); setIdea(""); setA1(null); setA2(null); setA3(null);
      }, [open]);

      if (!open) return null;

      const dopamineScore = [a1 === false, a2 === false, a3 === false].filter(Boolean).length;
      const verdict = dopamineScore >= 2
        ? { tone: "stop", title: "This is your dopamine talking.", body: "Park it. Don't act. Get back to today's actual task." }
        : dopamineScore === 1
        ? { tone: "wait", title: "Maybe later, not now.", body: "Park it. Revisit it after this week's important work is done." }
        : { tone: "ok", title: "This might be useful.", body: "Still park it for today. Finish today's task first, then decide with a clear head." };

      const finalize = () => {
        onPark({ text: idea, at: Date.now(), verdict: verdict.tone, dopamine_score: dopamineScore });
        onClose();
      };

      return (
        <div onClick={onClose} style={modalOverlay}>
          <div onClick={(e) => e.stopPropagation()} style={modalCard}>
            <div style={{ fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.24em", textTransform: "uppercase", color: tokens.accent, marginBottom: "8px" }}>Dopamine trap</div>
            {step === "idea" && (
              <>
                <h3 style={modalTitle}>What&apos;s the new idea?</h3>

              </>
            )}
            {step === "q1" && <TrapQ n="01" q={`Does this directly help ${goalName || "your current goal"}?`} onYes={() => { setA1(true); setStep("q2"); }} onNo={() => { setA1(false); setStep("q2"); }} />}
            {step === "q2" && <TrapQ n="02" q="Does this need action this week?" yesLabel="Yes, this week" noLabel="No, can wait" onYes={() => { setA2(true); setStep("q3"); }} onNo={() => { setA2(false); setStep("q3"); }} />}
            {step === "q3" && <TrapQ n="03" q="Honestly: is this a real next step or a relief hit?" yesLabel="Real step" noLabel="Relief hit" onYes={() => { setA3(true); setStep("verdict"); }} onNo={() => { setA3(false); setStep("verdict"); }} />}
            {step === "verdict" && (
              <>
                <h3 style={{ ...modalTitle, color: verdict.tone === "stop" ? tokens.accent : verdict.tone === "wait" ? tokens.ink : tokens.green }}>{verdict.title}</h3>
                <p style={{ fontFamily: tokens.fontDisplay, fontSize: "18px", lineHeight: 1.5, marginBottom: "28px" }}>{verdict.body}</p>
                {currentTask && <div style={{ padding: "20px", background: tokens.ink, color: tokens.paper, marginBottom: "28px" }}><div style={{ fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.20em", textTransform: "uppercase", color: tokens.accent, marginBottom: "10px" }}>Get back to</div><div style={{ fontFamily: tokens.fontDisplay, fontSize: "18px", lineHeight: 1.4 }}>{currentTask}</div></div>}
                <button onClick={finalize} style={primaryBtn(false)}>Park the idea & close</button>

            )}

              <details style={{ marginTop: "32px" }}>
                <summary style={{ fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.20em", textTransform: "uppercase", color: tokens.muted, cursor: "pointer", listStyle: "none" }}>{parkedIdeas.length} idea{parkedIdeas.length > 1 ? "s" : ""} parked so far</summary>
                <div style={{ marginTop: "12px" }}>
                  {parkedIdeas.slice(0, 10).map((p, i) => (
                    <div key={i} style={{ padding: "10px 0", borderBottom: `1px solid ${tokens.paperDeep}`, fontFamily: tokens.fontBody, fontSize: "13px", color: tokens.muted, display: "flex", justifyContent: "space-between", gap: "12px" }}>
                      <span style={{ flex: 1 }}>{p.text}</span>
                      <span style={{ fontFamily: tokens.fontMono, fontSize: "10px", color: p.verdict === "stop" ? tokens.accent : p.verdict === "wait" ? tokens.muted : tokens.green, flexShrink: 0 }}>{p.verdict}</span>
                    </div>
                  ))}
                </div>
              </details>
            )}
            <button onClick={onClose} style={{ marginTop: "24px", background: "transparent", border: "none", fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.20em", textTransform: "uppercase", color: tokens.muted, cursor: "pointer", padding: 0 }}>Close</button>
          </div>
        </div>
      );
    }

    function TrapQ({ n, q, onYes, onNo, yesLabel = "Yes", noLabel = "No" }) {
      return (
        <>
          <div style={{ fontFamily: tokens.fontMono, fontSize: "11px", letterSpacing: "0.18em", color: tokens.accent, marginBottom: "16px" }}>Question {n} / 03</div>
          <h3 style={{ fontFamily: tokens.fontDisplay, fontSize: "26px", lineHeight: 1.25, margin: "0 0 32px", fontWeight: 500 }}>{q}</h3>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px" }}>
            <button onClick={onYes} style={primaryBtn(false)}>{yesLabel}</button>
            <button onClick={onNo} style={{ ...primaryBtn(false), background: "transparent", color: tokens.ink, border: `1px solid ${tokens.ink}` }}>{noLabel}</button>
          </div>
        </>
      );
    }

    function LogModal({ open, onClose, log, onAdd }) {
      const [did, setDid] = useState("");
      const [avoided, setAvoided] = useState("");
      if (!open) return null;

      const submit = () => {
        if (!did.trim() && !avoided.trim()) return;
        onAdd({ date: todayKey(), at: Date.now(), what_i_did: did.trim(), what_i_avoided: avoided.trim() });
        setDid(""); setAvoided(""); onClose();
      };

      return (
        <div onClick={onClose} style={modalOverlay}>
          <div onClick={(e) => e.stopPropagation()} style={modalCard}>
            <div style={{ fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.24em", textTransform: "uppercase", color: tokens.muted, marginBottom: "8px" }}>Honesty log · {todayKey()}</div>
            <h3 style={modalTitle}>What actually happened?</h3>
            <div style={{ marginBottom: "20px" }}>
              <div style={{ fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.16em", textTransform: "uppercase", color: tokens.green, marginBottom: "8px" }}>What I did</div>
              <textarea value={did} onChange={(e) => setDid(e.target.value)} placeholder="The actual actions, not the planned ones." rows={3} style={textareaStyle} />
            </div>
            <div style={{ marginBottom: "24px" }}>
              <div style={{ fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.16em", textTransform: "uppercase", color: tokens.accent, marginBottom: "8px" }}>What I avoided</div>
              <textarea value={avoided} onChange={(e) => setAvoided(e.target.value)} placeholder="The honest part. What did you put off, and why." rows={3} style={textareaStyle} />
            </div>
            <button onClick={submit} style={primaryBtn(false)}>Log it</button>
            {log.length > 0 && (
              <details style={{ marginTop: "32px" }}>
                <summary style={{ fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.20em", textTransform: "uppercase", color: tokens.muted, cursor: "pointer", listStyle: "none" }}>Past entries ({log.length})</summary>
                <div style={{ marginTop: "16px" }}>
                  {log.slice(0, 10).map((e, i) => (
                    <div key={i} style={{ padding: "12px 0", borderBottom: `1px solid ${tokens.paperDeep}` }}>
                      <div style={{ fontFamily: tokens.fontMono, fontSize: "10px", color: tokens.muted, marginBottom: "4px" }}>{e.date}</div>
                      {e.what_i_did && <div style={{ fontFamily: tokens.fontBody, fontSize: "14px", color: tokens.ink, marginBottom: "4px" }}>✓ {e.what_i_did}</div>}
                      {e.what_i_avoided && <div style={{ fontFamily: tokens.fontBody, fontSize: "14px", color: tokens.muted, fontStyle: "italic" }}>✕ {e.what_i_avoided}</div>}
                    </div>
                  ))}
                </div>
              </details>
            )}
            <button onClick={onClose} style={{ marginTop: "20px", background: "transparent", border: "none", fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.20em", textTransform: "uppercase", color: tokens.muted, cursor: "pointer", padding: 0 }}>Close</button>
          </div>
        </div>
      );
    }

    function UnlockResultsModal({ open, onClose, onUnlock }) {
      const [code, setCode] = useState("");
      const [error, setError] = useState("");

      useEffect(() => {
        if (!open) {
          setCode("");
          setError("");
        }
      }, [open]);

      if (!open) return null;

      const submitCode = () => {
        const normalized = code.trim();
        if (normalized === RESULTS_OS_UNLOCK_CODE || normalized === RESULTS_OS_UNLOCK_CODE_LEGACY) {
          onUnlock();
          return;
        }
        setError("That code didn't work. Try again.");
      };

      return (
        <div onClick={onClose} style={modalOverlay}>
          <div onClick={(e) => e.stopPropagation()} style={modalCard}>
            <div style={{ fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.24em", textTransform: "uppercase", color: tokens.accent, marginBottom: "8px" }}>
              Unlock Results OS
            </div>
            <h3 style={modalTitle}>Free preview first. Pay to unlock all 21 days.</h3>
            <p style={{ fontFamily: tokens.fontBody, fontSize: "14px", color: tokens.muted, lineHeight: 1.6, marginBottom: "24px" }}>
              Preview the opening days for free. The paid unlock gives access to the full curriculum, the weekly review loop, the saved metrics system, and the locked coaching tools.
            </p>

            <a href={RESULTS_OS_CHECKOUT_URL} target="_blank" rel="noreferrer" style={{ display: "block", textDecoration: "none", marginBottom: "24px" }}>
              <div style={{ padding: "16px 18px", background: tokens.ink, color: tokens.paper, textAlign: "center", fontFamily: tokens.fontMono, fontSize: "11px", letterSpacing: "0.18em", textTransform: "uppercase" }}>
                Buy unlock →
              </div>
            </a>

            <div style={{ marginBottom: "10px", fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.16em", textTransform: "uppercase", color: tokens.muted }}>
              Already bought it?
            </div>
            <input
              type="password"
              value={code}
              onChange={(e) => {
                setCode(e.target.value);
                if (error) setError("");
              }}
              onKeyDown={(e) => e.key === "Enter" && submitCode()}
              placeholder="Enter your Results OS code"
              style={{ width: "100%", background: "rgba(255,255,255,0.72)", border: `1px solid ${tokens.paperDeep}`, color: tokens.ink, fontFamily: tokens.fontMono, fontSize: "14px", padding: "14px 16px", outline: "none", marginBottom: "12px" }}
            />
            <button onClick={submitCode} style={primaryBtn(false)}>
              Unlock with code
            </button>
            {error && <div style={{ marginTop: "12px", color: tokens.accent, fontSize: "13px" }}>{error}</div>}

            <button onClick={onClose} style={{ marginTop: "20px", background: "transparent", border: "none", fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.20em", textTransform: "uppercase", color: tokens.muted, cursor: "pointer", padding: 0 }}>
              Close
            </button>
          </div>
        </div>
      );
    }

    function ProfileSetupModal({ open, profile, onClose, onSave }) {
      const [draft, setDraft] = useState(profile);

      useEffect(() => {
        setDraft(profile);
      }, [profile, open]);

      if (!open) return null;

      const canClose = Boolean(profile.goalName?.trim());

      return (
        <div onClick={() => canClose && onClose()} style={modalOverlay}>
          <div onClick={(e) => e.stopPropagation()} style={modalCard}>
            <div style={{ fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.24em", textTransform: "uppercase", color: tokens.accent, marginBottom: "8px" }}>
              Set objectives
            </div>
            <h3 style={modalTitle}>Make Results OS fit the person using it.</h3>
            <p style={{ fontFamily: tokens.fontBody, fontSize: "14px", color: tokens.muted, lineHeight: 1.6, marginBottom: "24px" }}>
              These details personalise the dashboard so it knows what you&apos;re trying to protect when a new idea turns up.
            </p>

            <div style={{ display: "grid", gap: "14px" }}>
              <label>
                <div style={setupLabelStyle}>First name</div>
                <input value={draft.firstName} onChange={(e) => setDraft((prev) => ({ ...prev, firstName: e.target.value }))} placeholder="e.g. Alex" style={setupInputStyle} />
              </label>
              <label>
                <div style={setupLabelStyle}>Main goal</div>
                <input value={draft.goalName} onChange={(e) => setDraft((prev) => ({ ...prev, goalName: e.target.value }))} placeholder="e.g. Finish my course outline" style={setupInputStyle} />
              </label>
              <label>
                <div style={setupLabelStyle}>Goal deadline</div>
                <input value={draft.goalDeadline} onChange={(e) => setDraft((prev) => ({ ...prev, goalDeadline: e.target.value }))} placeholder="e.g. 30 June" style={setupInputStyle} />
              </label>
              <label>
                <div style={setupLabelStyle}>Current focus</div>
                <input value={draft.currentFocus} onChange={(e) => setDraft((prev) => ({ ...prev, currentFocus: e.target.value }))} placeholder="e.g. write the next lesson, not redesign the whole thing" style={setupInputStyle} />
              </label>
              <label>
                <div style={setupLabelStyle}>Days on track target</div>
                <input type="number" value={draft.consistencyTarget} onChange={(e) => setDraft((prev) => ({ ...prev, consistencyTarget: Number(e.target.value) || 0 }))} placeholder="5" style={setupInputStyle} />
              </label>
              <label>
                <div style={setupLabelStyle}>Success vision</div>
                <textarea value={draft.successVision} onChange={(e) => setDraft((prev) => ({ ...prev, successVision: e.target.value }))} rows={3} placeholder="Describe what gets better in your life if you actually stay with this goal." style={textareaStyle} />
              </label>
            </div>

            <div style={{ marginTop: "20px" }}>
              <button onClick={() => onSave({ ...DEFAULT_PROFILE, ...draft, goalName: draft.goalName.trim() })} disabled={!draft.goalName.trim()} style={primaryBtn(!draft.goalName.trim())}>
                Save objectives
              </button>
            </div>

            {canClose && (
              <button onClick={onClose} style={{ marginTop: "20px", background: "transparent", border: "none", fontFamily: tokens.fontMono, fontSize: "10px", letterSpacing: "0.20em", textTransform: "uppercase", color: tokens.muted, cursor: "pointer", padding: 0 }}>
                Close
              </button>
            )}
          </div>
        </div>
      );
    }

    const primaryBtn = (disabled) => ({
      padding: "16px 24px",
      background: tokens.ink,
      color: tokens.paper,
      border: "none",
      fontFamily: tokens.fontMono,
      fontSize: "11px",
      letterSpacing: "0.2em",
      textTransform: "uppercase",
      cursor: disabled ? "not-allowed" : "pointer",
      opacity: disabled ? 0.4 : 1,
      width: "100%",
    });

    const textareaStyle = {
      width: "100%",
      fontFamily: tokens.fontBody,
      fontSize: "15px",
      background: tokens.paperDeep,
      border: "none",
      borderLeft: `2px solid ${tokens.ink}`,
      padding: "12px 16px",
      outline: "none",
      resize: "vertical",
      color: tokens.ink,
      lineHeight: 1.5,
    };

    const modalOverlay = {
      position: "fixed",
      inset: 0,
      background: "rgba(14,14,12,0.85)",
      zIndex: 50,
      display: "flex",
      alignItems: "center",
      justifyContent: "center",
      padding: "24px",
    };

    const modalCard = {
      background: tokens.paper,
      maxWidth: "560px",
      width: "100%",
      padding: "40px",
      maxHeight: "85vh",
      overflowY: "auto",
    };

    const modalTitle = {
      fontFamily: tokens.fontDisplay,
      fontSize: "30px",
      fontStyle: "italic",
      margin: "0 0 16px",
      fontWeight: 400,
    };

    const setupLabelStyle = {
      fontFamily: tokens.fontMono,
      fontSize: "10px",
      letterSpacing: "0.16em",
      textTransform: "uppercase",
      color: tokens.muted,
      marginBottom: "8px",
    };

    const setupInputStyle = {
      width: "100%",
      background: "rgba(255,255,255,0.72)",
      border: `1px solid ${tokens.paperDeep}`,
      color: tokens.ink,
      fontFamily: tokens.fontBody,
      fontSize: "15px",
      padding: "14px 16px",
      outline: "none",
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<ResultsOS />);
  </script>
</body>
</html>
