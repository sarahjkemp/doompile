<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results OS | Doom Pile</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta
    name="description"
    content="Results OS is temporarily unavailable."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #0e0e0c;
      --paper: #f4f1ea;
      --paper-deep: #eae5da;
      --muted: #6b6862;
      --accent: #c8431f;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(ellipse at top, rgba(200, 67, 31, 0.05), transparent 46%),
        radial-gradient(ellipse at bottom right, rgba(14, 14, 12, 0.04), transparent 42%),
        var(--paper);
      color: var(--ink);
      font-family: "Inter Tight", system-ui, sans-serif;
    }

    a { color: inherit; }
  </style>
</head>
<body>
  <main style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;">
    <section style="max-width: 640px; width: 100%; border: 1px solid var(--paper-deep); background: rgba(255,255,255,0.58); padding: 40px 32px;">
      <div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px;">
        Temporarily unavailable
      </div>
      <h1 style="font-family: 'Fraunces', 'Times New Roman', serif; font-size: clamp(34px, 7vw, 56px); line-height: 0.98; letter-spacing: -0.03em; margin: 0 0 16px; font-weight: 500;">
        Results OS is offline for now.
      </h1>
      <p style="font-size: 16px; line-height: 1.7; color: var(--muted); margin: 0 0 24px;">
        This page has been taken down while it is being reworked.
      </p>
      <a href="/" style="display: inline-block; text-decoration: none; padding: 14px 18px; border: 1px solid var(--ink); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;">
        Back to Doom Pile
      </a>
    </section>
  </main>
</body>
</html>
