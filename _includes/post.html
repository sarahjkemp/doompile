<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} | Doom Pile</title>
<meta name="description" content="{{ description }}">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0E0E0F; --bg2: #161618; --border: rgba(255,255,255,0.08);
  --text: #F0EEE8; --muted: #6B6A66; --muted2: #9B9A96;
  --purple: #7C6FE0; --purple-light: #A99EF0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); font-weight: 300; line-height: 1.75; }
nav { padding: 0 2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; height: 56px; background: rgba(14,14,15,0.95); position: sticky; top: 0; z-index: 100; }
.logo { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; text-decoration: none; color: var(--text); }
.logo span { color: var(--purple-light); }
.nav-links { display: flex; gap: 1.5rem; }
.nav-links a { font-size: 0.85rem; color: var(--muted2); text-decoration: none; }
.nav-links a:hover { color: var(--text); }
main { max-width: 680px; margin: 0 auto; padding: 4rem 1.5rem 6rem; }
.post-tag { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--purple-light); margin-bottom: 1rem; display: block; }
h1 { font-family: 'Syne', sans-serif; font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 1.5rem; }
h1 em { color: var(--purple-light); font-style: normal; }
h2 { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 700; margin: 2.5rem 0 1rem; }
h3 { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 600; margin: 1.5rem 0 0.5rem; color: var(--purple-light); }
p { font-size: 0.95rem; color: var(--muted2); line-height: 1.8; margin-bottom: 1rem; }
p strong { color: var(--text); font-weight: 500; }
.intro { font-size: 1.05rem; color: var(--text); line-height: 1.8; margin-bottom: 2rem; }
blockquote { border-left: 3px solid var(--purple); padding: 1rem 1.5rem; margin: 2rem 0; font-size: 1rem; color: var(--text); line-height: 1.6; font-style: italic; }
.cta-box { background: linear-gradient(135deg, rgba(124,111,224,0.15), rgba(124,111,224,0.05)); border: 1px solid rgba(124,111,224,0.3); border-radius: 16px; padding: 2rem; text-align: center; margin: 2.5rem 0; }
.cta-box h3 { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--text); }
.cta-box p { font-size: 0.9rem; color: var(--muted2); margin-bottom: 1.5rem; }
.btn { display: inline-block; background: var(--purple); color: white; padding: 0.85rem 2rem; border-radius: 999px; font-family: 'Syne', sans-serif; font-weight: 600; font-size: 0.95rem; text-decoration: none; }
.related { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border); }
.related h3 { color: var(--muted2); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; }
.related-links { display: flex; flex-direction: column; gap: 0.75rem; }
.related-links a { color: var(--purple-light); text-decoration: none; font-size: 0.9rem; }
footer { text-align: center; padding: 2rem; border-top: 1px solid var(--border); font-size: 0.78rem; color: var(--muted); }
footer a { color: var(--muted); text-decoration: none; margin: 0 0.5rem; }
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">doom<span>pile</span></a>
  <div class="nav-links">
    <a href="/">App</a>
    <a href="/blog.html">Blog</a>
    <a href="/doompile-about.html">About</a>
  </div>
</nav>
<main>
  <span class="post-tag">{{ tag }}</span>
  {{ content }}
  <div class="related">
    <h3>Related reading</h3>
    <div class="related-links">
      {% for post in collections.posts %}
        {% if post.url != page.url %}
          <a href="{{ post.url }}">{{ post.data.title }} →</a>
        {% endif %}
      {% endfor %}
    </div>
  </div>
</main>
<footer>
  © 2026 SJK Labs ·
  <a href="/">App</a>
  <a href="/blog.html">Blog</a>
  <a href="/why-this-exists/">Why this exists</a>
  <a href="/doompile-about.html">About</a>
  <a href="https://www.notbuiltforthis.co/" target="_blank" rel="noreferrer">Not Built For This</a>
  <a href="/doompile-privacy.html">Privacy</a>
  <a href="/doompile-terms.html">Terms</a>
</footer>
</body>
</html>
